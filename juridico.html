<script type="module">

// ================= CACHE LOCAL ROBUSTO (INDEXEDDB) =================
// Compartilha o mesmo cache da página Clientes otimizada.
const CACHE_DB_NAME = 'amr_crm_cache_db';
const CACHE_DB_VERSION = 1;
const CACHE_STORE_NAME = 'dados';
const CACHE_CLIENTES_KEY = 'clientes_data_v2';
const CACHE_MAX_AGE_MS = 24 * 60 * 60 * 1000; // 24 horas
const REFRESH_COOLDOWN_MS = 30 * 1000;

let cacheDbPromise = null;
let carregarClientesPromise = null;
let ultimaSincronizacaoServidor = 0;
let timestampBaseCache = 0;

function abrirCacheDB() {
    if (cacheDbPromise) return cacheDbPromise;
    cacheDbPromise = new Promise((resolve, reject) => {
        if (!('indexedDB' in window)) {
            reject(new Error('IndexedDB não disponível neste navegador.'));
            return;
        }
        const request = indexedDB.open(CACHE_DB_NAME, CACHE_DB_VERSION);
        request.onupgradeneeded = () => {
            const dbCache = request.result;
            if (!dbCache.objectStoreNames.contains(CACHE_STORE_NAME)) {
                dbCache.createObjectStore(CACHE_STORE_NAME, { keyPath: 'key' });
            }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error || new Error('Erro ao abrir o cache local.'));
    });
    return cacheDbPromise;
}

async function lerCacheClientes() {
    try {
        const dbCache = await abrirCacheDB();
        const registro = await new Promise((resolve, reject) => {
            const tx = dbCache.transaction(CACHE_STORE_NAME, 'readonly');
            const store = tx.objectStore(CACHE_STORE_NAME);
            const req = store.get(CACHE_CLIENTES_KEY);
            req.onsuccess = () => resolve(req.result || null);
            req.onerror = () => reject(req.error);
        });
        if (!registro || !registro.json) return null;
        const data = JSON.parse(registro.json);
        if (!Array.isArray(data)) return null;
        return { data, timestamp: Number(registro.timestamp || 0) };
    } catch (error) {
        console.warn('Não foi possível ler o cache IndexedDB:', error);
        return null;
    }
}

async function salvarCacheClientes(lista, timestamp = timestampBaseCache || Date.now()) {
    try {
        const dbCache = await abrirCacheDB();
        const json = JSON.stringify(lista);
        await new Promise((resolve, reject) => {
            const tx = dbCache.transaction(CACHE_STORE_NAME, 'readwrite');
            const store = tx.objectStore(CACHE_STORE_NAME);
            store.put({ key: CACHE_CLIENTES_KEY, timestamp, json });
            tx.oncomplete = () => resolve();
            tx.onerror = () => reject(tx.error);
            tx.onabort = () => reject(tx.error || new Error('Gravação do cache abortada.'));
        });
    } catch (error) {
        console.warn('Não foi possível salvar o cache IndexedDB:', error);
    }
}

async function migrarCacheAntigoSeExistir() {
    try {
        const cachedData = localStorage.getItem('amr_crm_clientes_data');
        const cacheTimestamp = localStorage.getItem('amr_crm_clientes_timestamp');
        if (!cachedData) return null;
        const parsedData = JSON.parse(cachedData);
        if (!Array.isArray(parsedData)) return null;
        const timestamp = Number(cacheTimestamp || Date.now());
        timestampBaseCache = timestamp;
        await salvarCacheClientes(parsedData, timestamp);
        return { data: parsedData, timestamp };
    } catch (error) {
        console.warn('Não foi possível migrar o cache antigo:', error);
        return null;
    } finally {
        try { localStorage.removeItem('amr_crm_clientes_data'); } catch(e) {}
    }
}

function atualizarCacheLocal() {
    salvarCacheClientes(clientesData, timestampBaseCache || Date.now()).catch(error => {
        console.warn('Falha ao atualizar cache local:', error);
    });
}

function normalizarClientesDoSnapshot(snapshot) {
    return snapshot.docs.map(docSnap => {
        const data = docSnap.data();
        try {
            if (data.dataFechamento && typeof data.dataFechamento.toDate === 'function') {
                data.dataFechamento = data.dataFechamento.toDate().toISOString();
            }
            if (data.ultimoAndamento && typeof data.ultimoAndamento.toDate === 'function') {
                data.ultimoAndamento = data.ultimoAndamento.toDate().toISOString();
            }
            if (data.dataUltimoAndamento && typeof data.dataUltimoAndamento.toDate === 'function') {
                data.dataUltimoAndamento = data.dataUltimoAndamento.toDate().toISOString();
            }
        } catch(e) {}
        return { id: docSnap.id, ...data };
    });
}

async function buscarClientesNoServidor() {
    // ÚNICA leitura completa da coleção nesta página.
    const q = query(collection(db, 'clientes'));
    const snapshot = await getDocs(q);
    const lista = normalizarClientesDoSnapshot(snapshot);
    ultimaSincronizacaoServidor = Date.now();
    timestampBaseCache = ultimaSincronizacaoServidor;
    await salvarCacheClientes(lista, timestampBaseCache);
    return lista;
}

async function executarCargaProtegida(forcarServidor = false) {
    const executar = async () => {
        if (!forcarServidor) {
            let cache = await lerCacheClientes();
            if (!cache) cache = await migrarCacheAntigoSeExistir();
            if (cache && Array.isArray(cache.data)) {
                const idade = Date.now() - Number(cache.timestamp || 0);
                if (idade >= 0 && idade < CACHE_MAX_AGE_MS) {
                    timestampBaseCache = cache.timestamp;
                    return { lista: cache.data, origem: 'cache' };
                }
            }
        }
        const lista = await buscarClientesNoServidor();
        return { lista, origem: 'servidor' };
    };

    // Mesmo lock da página Clientes: duas abas não baixam a coleção inteira juntas.
    if (navigator.locks && typeof navigator.locks.request === 'function') {
        return navigator.locks.request('amr_crm_clientes_firestore_sync', executar);
    }
    return executar();
}

window.forcarAtualizacao = async function() {
    const agora = Date.now();
    if (agora - ultimaSincronizacaoServidor < REFRESH_COOLDOWN_MS) {
        showToast('Os dados já foram sincronizados há poucos segundos.');
        return;
    }
    showToast('Buscando dados recentes do servidor...');
    await carregarClientes({ forcarServidor: true });
};


// Extrai Documentos (Helpers)
function extrairDocumentos(docsOriginais) {
    let listaDocs = [];
    if (Array.isArray(docsOriginais)) {
        listaDocs = docsOriginais;
    } else if (docsOriginais && typeof docsOriginais === 'object') {
        Object.values(docsOriginais).forEach(categoriaArray => {
            if (Array.isArray(categoriaArray)) {
                listaDocs = listaDocs.concat(categoriaArray);
            }
        });
    }
    return listaDocs;
}

function atualizarResumo(lista) {
    const total = lista.length;
    const lancados = lista.filter(c => c.lancadoSistemaInterno === true).length;
    const aguardando = total - lancados;

    document.getElementById('resumoTotal').textContent = total;
    document.getElementById('resumoAguardando').textContent = aguardando;
    document.getElementById('resumoLancados').textContent = lancados;
}

window.aplicarFiltrosEOrdenacao = function() {
    const termo = inputBusca.value.toLowerCase().trim();
    
    // REGRA 1: Apenas os que estão com status "fechado"
    let filtrados = clientesData.filter(c => c.status === "fechado");

    if (termo !== '') {
        filtrados = filtrados.filter(c => {
            const nome = (c.nome || "").toLowerCase();
            const cpf = (c.cpf || "").toLowerCase();
            const processo = (c.processo || "").toLowerCase();
            const telefone = (c.numeros || "").toLowerCase();
            const tipoProcesso = (c.tipoProcesso || c.tipo_processo || "").toLowerCase();
            const vendedor = (c.nomeVendedor || c.vendedor || "").toLowerCase();
            return nome.includes(termo) || cpf.includes(termo) || processo.includes(termo) || telefone.includes(termo) || tipoProcesso.includes(termo) || vendedor.includes(termo);
        });
    }

    // REGRA 2: Ordenação Visual Customizada (Jurídico)
    filtrados.sort((a, b) => {
        const isLancadoA = a.lancadoSistemaInterno === true;
        const isLancadoB = b.lancadoSistemaInterno === true;

        if (isLancadoA !== isLancadoB) {
            return isLancadoA ? 1 : -1; 
        }

        const dateA = a.dataFechamento ? (a.dataFechamento.toDate ? a.dataFechamento.toDate() : new Date(a.dataFechamento)) : new Date(0);
        const dateB = b.dataFechamento ? (b.dataFechamento.toDate ? b.dataFechamento.toDate() : new Date(b.dataFechamento)) : new Date(0);
        
        return dateB - dateA;
    });

    exibirClientes(filtrados);
}

inputBusca.addEventListener('input', aplicarFiltrosEOrdenacao);

// ================= MARCAR COMO LANÇADO =================
window.toggleLancamento = async function(id, currentState) {
    const newState = !currentState;
    
    const cardEl = document.getElementById(`card-cliente-${id}`);
    const btnEl = document.getElementById(`btnLancamento-${id}`);
    
    if (newState) {
        cardEl.classList.add('lancado');
        btnEl.innerHTML = "✔️";
        btnEl.title = "Desmarcar Lançamento";
    } else {
        cardEl.classList.remove('lancado');
        btnEl.innerHTML = "⏳";
        btnEl.title = "Marcar como Lançado";
    }

    try {
        const clienteRef = doc(db, "clientes", id);
        await updateDoc(clienteRef, { lancadoSistemaInterno: newState });
        
        const idx = clientesData.findIndex(c => c.id === id);
        if (idx > -1) {
            clientesData[idx].lancadoSistemaInterno = newState;
            atualizarCacheLocal();
        }
        
        showToast(newState ? "Card marcado como Lançado!" : "Lançamento desmarcado!");
        
        setTimeout(() => { aplicarFiltrosEOrdenacao(); }, 1500);

    } catch(err) {
        console.error(err);
        showToast("Erro ao atualizar o card.");
    }
}

// ================= CARREGAR E RENDERIZAR CARDS =================
async function carregarClientes(opcoes = {}) {
    const forcarServidor = Boolean(opcoes.forcarServidor);

    if (carregarClientesPromise) {
        if (!forcarServidor) return carregarClientesPromise;
        try { await carregarClientesPromise; } catch(e) {}
    }

    carregarClientesPromise = (async () => {
        container.innerHTML = "<p style='color:rgba(255,255,255,0.5);'>Carregando base do Jurídico...</p>";
        let cacheAnterior = null;

        if (!forcarServidor) {
            cacheAnterior = await lerCacheClientes();
            if (!cacheAnterior) cacheAnterior = await migrarCacheAntigoSeExistir();
            if (cacheAnterior && Array.isArray(cacheAnterior.data)) {
                const idade = Date.now() - Number(cacheAnterior.timestamp || 0);
                if (idade >= 0 && idade < CACHE_MAX_AGE_MS) {
                    timestampBaseCache = cacheAnterior.timestamp;
                    clientesData = cacheAnterior.data;
                    aplicarFiltrosEOrdenacao();
                    return;
                }
            }
        }

        try {
            const resultado = await executarCargaProtegida(forcarServidor);
            clientesData = resultado.lista;
            aplicarFiltrosEOrdenacao();
            if (resultado.origem === 'servidor' && forcarServidor) {
                showToast('Dados sincronizados com o servidor!');
            }
        } catch (error) {
            console.error('Erro ao carregar dados:', error);
            const fallback = cacheAnterior || await lerCacheClientes();
            if (fallback && Array.isArray(fallback.data)) {
                timestampBaseCache = fallback.timestamp;
                clientesData = fallback.data;
                aplicarFiltrosEOrdenacao();
                showToast('Servidor indisponível. Exibindo dados do cache local.');
                return;
            }
            showToast('Erro ao carregar dados.');
        }
    })();

    try {
        return await carregarClientesPromise;
    } finally {
        carregarClientesPromise = null;
    }
}

function exibirClientes(lista) {
    atualizarResumo(lista);
    
    container.innerHTML = "";
    if(lista.length === 0) {
        container.innerHTML = "<p style='color:rgba(255,255,255,0.5);'>Nenhum cliente fechado encontrado.</p>";
        return;
    }
    
    lista.forEach(cliente => {
        const isLancado = cliente.lancadoSistemaInterno === true;
        const card = document.createElement("div");
        
        card.className = `card ${isLancado ? 'lancado' : ''}`;
        card.id = `card-cliente-${cliente.id}`;
        
        let dataFechamentoStr = "";
        try {
            if (cliente.dataFechamento) {
                const dataObj = cliente.dataFechamento.toDate ? cliente.dataFechamento.toDate() : new Date(cliente.dataFechamento);
                if (!isNaN(dataObj)) dataFechamentoStr = dataObj.toLocaleDateString('pt-BR');
            }
        } catch(e) {}

        let dataAndamentoStr = "Nenhum";
        try {
            if (cliente.ultimoAndamento) {
                const dataAndObj = cliente.ultimoAndamento.toDate ? cliente.ultimoAndamento.toDate() : new Date(cliente.ultimoAndamento);
                if (!isNaN(dataAndObj)) dataAndamentoStr = dataAndObj.toLocaleDateString('pt-BR');
            }
        } catch(e) {}

        const documentosArr = extrairDocumentos(cliente.documentos);
        let docsIndicator = '';
        if (documentosArr.length > 0) {
            docsIndicator = `<div class="indicator-docs"><i class="fi fi-tr-clip"></i> ${documentosArr.length} Doc(s)</div>`;
        }

        const btnIcon = isLancado ? '✔️' : '⏳';
        const btnTitle = isLancado ? 'Desmarcar Lançamento' : 'Marcar como Lançado';

        card.innerHTML = `
            <div class="color-bar"></div>
            <div class="card-content">
                ${docsIndicator}
                
                <div class="action-badges">
                    <div class="badge-btn badge-lancamento" title="${btnTitle}" id="btnLancamento-${cliente.id}" 
                         onclick="event.stopPropagation(); toggleLancamento('${cliente.id}', ${isLancado})">
                        ${btnIcon}
                    </div>
                </div>

                <div class="card-header-info">
                    <span style="background: rgba(16, 185, 129, 0.2); color: #10b981; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; border: 1px solid rgba(16, 185, 129, 0.3);">
                        FECHADO
                    </span>
                    ${dataFechamentoStr ? `<span class="card-date">Fechado em: ${dataFechamentoStr}</span>` : ''}
                </div>

                <h2>${cliente.nome || "Sem nome"}</h2>
                <p><strong>CPF:</strong> ${cliente.cpf || "-"}</p>
                <p><strong>Processo:</strong> ${cliente.processo || "Não informado"}</p>
                <p><strong>Tipo de Processo:</strong> ${cliente.tipoProcesso || cliente.tipo_processo || "Não informado"}</p>
                <p><strong>Vendedor:</strong> ${cliente.nomeVendedor || cliente.vendedor || "Não informado"}</p>
                <p><strong>Observação do Vendedor:</strong> ${cliente.observacaoVendedor || cliente.observacao_vendedor || "Sem observação"}</p>
                
                <div class="tramitacao-box">
                    <p><strong>Último Andamento:</strong> ${dataAndamentoStr}</p>
                    <p style="font-size: 11px; margin-top: 4px; opacity: 0.8;">
                        <strong>Tramitação:</strong> ${cliente.tramitacaoProcessual || "Sem informações de tramitação cadastradas."}
                    </p>
                </div>
            </div>
        `;
        
        card.onclick = () => abrirModalEdicao(cliente);
        container.appendChild(card);
    });
}

// ================= MODAL DE EDIÇÃO =================
const modalView = document.getElementById('modalEdicao');

window.abrirModalEdicao = function(cliente) {
    clienteAtual = cliente;
    
    document.getElementById('modalTitulo').textContent = "Editar: " + (cliente.nome || "Cliente");
    
    // Preencher Inputs Gerais
    document.getElementById('editNome').value = cliente.nome || "";
    document.getElementById('editCpf').value = cliente.cpf || "";
    document.getElementById('editTelefone').value = cliente.numeros || "";
    document.getElementById('editEmail').value = cliente.email || "";
    document.getElementById('editProcesso').value = cliente.processo || "";
    document.getElementById('editTipoProcesso').value = cliente.tipoProcesso || cliente.tipo_processo || "";
    document.getElementById('editVendedor').value = cliente.nomeVendedor || cliente.vendedor || "";
    document.getElementById('editObservacaoVendedor').value = cliente.observacaoVendedor || cliente.observacao_vendedor || "";
    
    // Preencher Andamento
    document.getElementById('editTramitacao').value = cliente.tramitacaoProcessual || "";
    try {
        if (cliente.ultimoAndamento) {
            const dataUltAnd = cliente.ultimoAndamento.toDate ? cliente.ultimoAndamento.toDate() : new Date(cliente.ultimoAndamento);
            if (!isNaN(dataUltAnd)) {
                document.getElementById('editUltimoAndamento').value = dataUltAnd.toISOString().split('T')[0];
            } else {
                document.getElementById('editUltimoAndamento').value = "";
            }
        } else {
            document.getElementById('editUltimoAndamento').value = "";
        }
    } catch (err) {
        document.getElementById('editUltimoAndamento').value = "";
    }

    renderizarDocumentos();
    modalView.style.display = "flex";
}

window.fecharModal = function() {
    modalView.style.display = "none";
    clienteAtual = null;
}

modalView.addEventListener('click', (e) => {
    if(e.target === modalView) fecharModal();
});

// ================= SALVAR ALTERAÇÕES =================
window.salvarAlteracoes = async function() {
    if (!clienteAtual) return;
    
    const btn = document.getElementById('btnSalvarEdicao');
    btn.textContent = "Salvando...";
    btn.disabled = true;

    try {
        const dataUltAndStr = document.getElementById('editUltimoAndamento').value;
        const dataAndamentoFormatada = dataUltAndStr ? dataUltAndStr + "T12:00:00" : "";

        const updates = {
            nome: document.getElementById('editNome').value.trim(),
            cpf: document.getElementById('editCpf').value.trim(),
            numeros: document.getElementById('editTelefone').value.trim(),
            email: document.getElementById('editEmail').value.trim(),
            processo: document.getElementById('editProcesso').value.trim(),
            tipoProcesso: document.getElementById('editTipoProcesso').value.trim(),
            nomeVendedor: document.getElementById('editVendedor').value.trim(),
            observacaoVendedor: document.getElementById('editObservacaoVendedor').value.trim(),
            tramitacaoProcessual: document.getElementById('editTramitacao').value.trim(),
            ultimoAndamento: dataAndamentoFormatada
        };

        const docRef = doc(db, "clientes", clienteAtual.id);
        await updateDoc(docRef, updates);
        
        // Atualiza a lista em memória
        Object.assign(clienteAtual, updates);
        const idxCache = clientesData.findIndex(c => c.id === clienteAtual.id);
        if (idxCache > -1) clientesData[idxCache] = clienteAtual;
        atualizarCacheLocal();
        
        showToast("Informações do cliente atualizadas!");
        aplicarFiltrosEOrdenacao();
        fecharModal();
        
    } catch(err) {
        console.error(err);
        showToast("Erro ao salvar as edições.");
    } finally {
        btn.textContent = "Salvar Alterações";
        btn.disabled = false;
    }
}

// ================= DOCUMENTOS =================
window.anexarDocumento = async function() {
    if(!clienteAtual) return;

    const fileInput = document.getElementById('addDocFile');
    const file = fileInput.files[0];
    const btn = document.getElementById('btnAnexarDoc');

    if(!file) {
        showToast("Selecione um arquivo para anexar.");
        return;
    }
    
    btn.textContent = "Enviando...";
    btn.disabled = true;

    try {
        const storageRef = ref(storage, `documentos_clientes/${clienteAtual.id}/${Date.now()}_${file.name}`);
        const uploadTask = await uploadBytesResumable(storageRef, file);
        const downloadURL = await getDownloadURL(uploadTask.ref);

        let docsAtuais = clienteAtual.documentos;
        const novoDocObj = {
            // Compatibilidade com as duas estruturas já usadas no CRM:
            // CRM antigo usa "name"; Clientes/Jurídico usam "nome".
            // Em todos os casos, o valor gravado é o NOME ORIGINAL do arquivo.
            name: file.name,
            nome: file.name,
            nomeOriginal: file.name,
            nomeArquivo: file.name,
            url: downloadURL,
            dataEnvio: new Date().toISOString()
        };

        if (Array.isArray(docsAtuais)) {
            docsAtuais.push(novoDocObj);
        } else if (docsAtuais && typeof docsAtuais === 'object') {
            if (!docsAtuais.outros) docsAtuais.outros = [];
            docsAtuais.outros.push(novoDocObj);
        } else {
            docsAtuais = { outros: [novoDocObj] };
        }

        const docRef = doc(db, "clientes", clienteAtual.id);
        await updateDoc(docRef, { documentos: docsAtuais });

        clienteAtual.documentos = docsAtuais;
        const idxCache = clientesData.findIndex(c => c.id === clienteAtual.id);
        if (idxCache > -1) clientesData[idxCache] = clienteAtual;
        atualizarCacheLocal();
        
        fileInput.value = "";
        
        renderizarDocumentos();
        showToast("Documento anexado com sucesso!");

    } catch (error) {
        console.error("Erro no upload:", error);
        showToast("Erro ao anexar arquivo.");
    } finally {
        btn.textContent = "Anexar Documento";
        btn.disabled = false;
    }
}

function obterNomeOriginalDocumento(doc) {
    if (!doc) return "Documento";

    // Em versões antigas do CRM, alguns documentos podem eventualmente
    // aparecer como uma URL/string em vez de objeto.
    if (typeof doc === 'string') {
        if (!doc.includes('://')) return doc;
        return extrairNomeOriginalDaUrl(doc) || "Documento";
    }

    // IMPORTANTE: o CRM que fez os uploads antigos grava assim:
    // { name: file.name, url: url }
    // Por isso "name" precisa ser lido antes de qualquer fallback.
    const candidatosOriginais = [
        doc.name,
        doc.nomeOriginal,
        doc.nomeArquivo,
        doc.fileName,
        doc.filename,
        doc.originalName,
        doc.originalFilename
    ];

    for (const candidato of candidatosOriginais) {
        if (typeof candidato === 'string' && candidato.trim() && candidato !== 'undefined') {
            return candidato.trim();
        }
    }

    // Se o objeto antigo não tiver o campo de nome, recupera pelo caminho
    // do Firebase Storage. Isso funciona para URLs no formato /o/pasta%2Farquivo.
    const urlDocumento = doc.url || doc.downloadURL || doc.downloadUrl || doc.href || doc.link || '';
    const nomePelaUrl = extrairNomeOriginalDaUrl(urlDocumento);
    if (nomePelaUrl) return nomePelaUrl;

    // Último fallback para documentos criados pela página Clientes antiga.
    // Nessa estrutura o campo disponível era "nome".
    if (typeof doc.nome === 'string' && doc.nome.trim() && doc.nome !== 'undefined') {
        return doc.nome.trim();
    }

    return "Documento";
}

function extrairNomeOriginalDaUrl(urlDocumento) {
    if (!urlDocumento || typeof urlDocumento !== 'string') return '';

    try {
        const url = new URL(urlDocumento);
        let caminho = url.pathname || '';

        // Firebase Storage: /v0/b/<bucket>/o/documentos%2Fuid%2F123_nome.pdf
        const marcador = '/o/';
        const posicao = caminho.indexOf(marcador);
        if (posicao >= 0) caminho = caminho.substring(posicao + marcador.length);

        caminho = decodeURIComponent(caminho);
        let nome = caminho.split('/').filter(Boolean).pop() || '';

        // Os uploads existentes usam Date.now() + "_" + file.name.
        // Remove SOMENTE o timestamp gerado pelo sistema, preservando o nome real.
        nome = nome.replace(/^\d{10,17}_/, '');

        return nome.trim();
    } catch (e) {
        // Fallback para URLs que não forem aceitas pelo construtor URL.
        try {
            let limpa = decodeURIComponent(urlDocumento.split('?')[0]);
            let nome = limpa.split('/').filter(Boolean).pop() || '';
            nome = nome.replace(/^\d{10,17}_/, '');
            return nome.trim();
        } catch (_) {
            return '';
        }
    }
}

function escaparHtml(valor) {
    return String(valor ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}

function renderizarDocumentos() {
    const containerDocs = document.getElementById('listaDocsContainer');
    const documentos = extrairDocumentos(clienteAtual.documentos);

    if (documentos.length === 0) {
        containerDocs.innerHTML = '<p style="font-size:12px; color:rgba(255,255,255,0.4);">Nenhum documento anexado.</p>';
        return;
    }

    containerDocs.innerHTML = documentos.map(doc => {
        const nomeDoArquivo = obterNomeOriginalDocumento(doc);
        const urlDocumento = typeof doc === 'string' ? doc : (doc.url || doc.downloadURL || doc.downloadUrl || doc.href || doc.link || '#');
        const nomeSeguro = escaparHtml(nomeDoArquivo);
        const urlSegura = escaparHtml(urlDocumento);

        return `
            <div class="doc-item">
                <div class="doc-info">
                    <i class="fi fi-tr-document"></i>
                    <span title="${nomeSeguro}">${nomeSeguro}</span>
                </div>
                <a href="${urlSegura}" target="_blank" rel="noopener noreferrer" class="btn-view-doc">Acessar</a>
            </div>
        `;
    }).join('');
}

carregarClientes();
